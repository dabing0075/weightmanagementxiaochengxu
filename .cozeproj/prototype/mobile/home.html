<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #F26B3A;
      --color-primary-container:    #FDE8DF;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（M3 色调系统 + Apple HIG 呼吸感） === */
      --color-background:                 #F7F4ED;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FAF8F3;
      --color-surface-container:          #F0EDE6;
      --color-surface-container-high:     #E8E5DE;
      --color-surface-container-highest:  #E0DDD6;
      /* === 文字 === */
      --color-on-surface:           #1E2933;
      --color-on-surface-variant:   #6B7280;
      /* === 功能色 === */
      --color-success:  #3C8D6E;
      --color-error:    #EF4444;
      --color-warning:  #F59E0B;
      /* === 边框 === */
      --color-outline:          #D1D5DB;
      --color-outline-variant:  #E4DED2;
      /* === 圆角 === */
      --radius-sm:   0.5rem;
      --radius-md:   0.75rem;
      --radius-lg:   1rem;
      --radius-xl:   1.5rem;
      --radius-2xl:  2rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 4px 12px rgba(0,0,0,0.08);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.08);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.12);
      /* === 字体 === */
      --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件，不需要的页面则不要复制此段（从 @nav:start 到 @nav:end） -->
  <!-- 顶部 Header -->
  <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-between px-4">
    <div class="w-10 h-10 flex items-center justify-center">
      <!-- 首页不显示返回按钮 -->
    </div>
    <h1 class="text-base font-semibold text-on-surface">健康管理</h1>
    <button id="btn-notification" class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full
                   hover:bg-surface-container active:bg-surface-container-high transition-colors">
      <i data-lucide="bell" class="w-5 h-5"></i>
    </button>
  </header>

  <main class="flex-1 overflow-y-auto pb-[calc(3.5rem+env(safe-area-inset-bottom))]">
    <!-- @main-content:start -->
    
    <!-- 今日打卡状态提示 -->
    <div class="px-4 pt-3 pb-2">
      <div id="checkin-status" class="bg-surface rounded-xl shadow-card p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-success/15 rounded-full flex items-center justify-center">
            <i data-lucide="check-circle" class="w-5 h-5 text-success"></i>
          </div>
          <div>
            <p class="text-sm font-semibold text-on-surface">今日已打卡</p>
            <p class="text-xs text-on-surface-variant mt-0.5">坚持就是胜利，继续保持！</p>
          </div>
        </div>
        <button id="btn-checkin" class="px-4 py-2 bg-primary text-on-primary text-sm font-semibold rounded-lg
                        hover:opacity-90 active:scale-[0.98] transition-all">
          打卡
        </button>
      </div>
    </div>

    <!-- 健康指标概览 -->
    <div class="px-4 pt-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-semibold text-on-surface">健康指标</h2>
        <a href="data.html" class="text-xs text-primary font-medium">查看全部</a>
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <!-- 指标卡片1：体重 -->
        <div id="card-weight" class="bg-surface rounded-xl shadow-card p-4">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-7 h-7 bg-primary/15 rounded-lg flex items-center justify-center">
              <i data-lucide="scale" class="w-4 h-4 text-primary"></i>
            </div>
            <span class="text-xs font-medium text-on-surface-variant">体重</span>
          </div>
          <p class="text-2xl font-bold text-on-surface">68.5<span class="text-sm font-normal text-on-surface-variant ml-1">kg</span></p>
          <div class="mt-2 flex items-center gap-1">
            <span class="text-xs text-on-surface-variant">目标 65kg</span>
            <span class="text-xs text-warning font-medium">差 3.5kg</span>
          </div>
        </div>

        <!-- 指标卡片2：腰围 -->
        <div id="card-waist" class="bg-surface rounded-xl shadow-card p-4">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-7 h-7 bg-success/15 rounded-lg flex items-center justify-center">
              <i data-lucide="ruler" class="w-4 h-4 text-success"></i>
            </div>
            <span class="text-xs font-medium text-on-surface-variant">腰围</span>
          </div>
          <p class="text-2xl font-bold text-on-surface">82<span class="text-sm font-normal text-on-surface-variant ml-1">cm</span></p>
          <div class="mt-2">
            <span class="text-xs text-success font-medium">正常范围</span>
          </div>
        </div>

        <!-- 指标卡片3：BMI -->
        <div id="card-bmi" class="bg-surface rounded-xl shadow-card p-4">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-7 h-7 bg-primary/15 rounded-lg flex items-center justify-center">
              <i data-lucide="activity" class="w-4 h-4 text-primary"></i>
            </div>
            <span class="text-xs font-medium text-on-surface-variant">BMI</span>
          </div>
          <p class="text-2xl font-bold text-on-surface">22.8</p>
          <div class="mt-2">
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-success/15 text-success">健康</span>
          </div>
        </div>

        <!-- 指标卡片4：体脂率 -->
        <div id="card-bodyfat" class="bg-surface rounded-xl shadow-card p-4">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-7 h-7 bg-warning/15 rounded-lg flex items-center justify-center">
              <i data-lucide="percent" class="w-4 h-4 text-warning"></i>
            </div>
            <span class="text-xs font-medium text-on-surface-variant">体脂率</span>
          </div>
          <p class="text-2xl font-bold text-on-surface">18.5<span class="text-sm font-normal text-on-surface-variant ml-1">%</span></p>
          <div class="mt-2">
            <span class="text-xs text-success font-medium">正常 15-20%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 近7天体重趋势图表 -->
    <div class="px-4 pt-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-semibold text-on-surface">体重趋势</h2>
        <span class="text-xs text-on-surface-variant">近7天</span>
      </div>
      
      <div class="bg-surface rounded-xl shadow-card p-4">
        <!-- 迷你折线图 -->
        <div class="relative h-32">
          <svg viewBox="0 0 320 100" class="w-full h-full" preserveAspectRatio="none">
            <!-- 网格线 -->
            <line x1="0" y1="25" x2="320" y2="25" stroke="#E4DED2" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="0" y1="50" x2="320" y2="50" stroke="#E4DED2" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="0" y1="75" x2="320" y2="75" stroke="#E4DED2" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 折线区域填充 -->
            <path d="M0,60 L53,55 L106,58 L159,50 L212,45 L265,48 L320,40 L320,100 L0,100 Z" 
                  fill="url(#gradient)" opacity="0.3"/>
            
            <!-- 折线 -->
            <path d="M0,60 L53,55 L106,58 L159,50 L212,45 L265,48 L320,40" 
                  stroke="#F26B3A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- 数据点 -->
            <circle cx="0" cy="60" r="4" fill="#F26B3A"/>
            <circle cx="53" cy="55" r="4" fill="#F26B3A"/>
            <circle cx="106" cy="58" r="4" fill="#F26B3A"/>
            <circle cx="159" cy="50" r="4" fill="#F26B3A"/>
            <circle cx="212" cy="45" r="4" fill="#F26B3A"/>
            <circle cx="265" cy="48" r="4" fill="#F26B3A"/>
            <circle cx="320" cy="40" r="5" fill="#F26B3A" stroke="#fff" stroke-width="2"/>
            
            <!-- 渐变定义 -->
            <defs>
              <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#F26B3A" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#F26B3A" stop-opacity="0"/>
              </linearGradient>
            </defs>
          </svg>
          
          <!-- 当前值标注 -->
          <div class="absolute right-0 top-0 bg-primary text-on-primary text-xs font-semibold px-2 py-1 rounded-lg">
            68.5kg
          </div>
        </div>
        
        <!-- 日期标签 -->
        <div class="flex justify-between mt-3 text-xs text-on-surface-variant">
          <span>周一</span>
          <span>周二</span>
          <span>周三</span>
          <span>周四</span>
          <span>周五</span>
          <span>周六</span>
          <span class="text-primary font-medium">今天</span>
        </div>
      </div>
    </div>

    <!-- 快速操作区 -->
    <div class="px-4 pt-6 pb-6">
      <h2 class="text-base font-semibold text-on-surface mb-3">快速操作</h2>
      
      <div class="grid grid-cols-3 gap-3">
        <!-- 操作按钮1：一键打卡 -->
        <button id="btn-quick-checkin" class="bg-surface rounded-xl shadow-card p-4 flex flex-col items-center gap-2
                        hover:bg-surface-container active:scale-[0.98] transition-all">
          <div class="w-12 h-12 bg-primary/15 rounded-xl flex items-center justify-center">
            <i data-lucide="check-circle" class="w-6 h-6 text-primary"></i>
          </div>
          <span class="text-sm font-medium text-on-surface">一键打卡</span>
        </button>

        <!-- 操作按钮2：详细数据 -->
        <a href="data.html" class="bg-surface rounded-xl shadow-card p-4 flex flex-col items-center gap-2
                        hover:bg-surface-container active:scale-[0.98] transition-all">
          <div class="w-12 h-12 bg-success/15 rounded-xl flex items-center justify-center">
            <i data-lucide="file-text" class="w-6 h-6 text-success"></i>
          </div>
          <span class="text-sm font-medium text-on-surface">详细数据</span>
        </a>

        <!-- 操作按钮3：设置目标 -->
        <button id="btn-set-goal" class="bg-surface rounded-xl shadow-card p-4 flex flex-col items-center gap-2
                        hover:bg-surface-container active:scale-[0.98] transition-all">
          <div class="w-12 h-12 bg-warning/15 rounded-xl flex items-center justify-center">
            <i data-lucide="target" class="w-6 h-6 text-warning"></i>
          </div>
          <span class="text-sm font-medium text-on-surface">设置目标</span>
        </button>
      </div>
    </div>

    <!-- @main-content:end -->
  </main>

  <!-- 底部 TabBar（一级页专用） -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-surface
              flex justify-around items-center h-14 pb-[env(safe-area-inset-bottom)]">
    <a href="home.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-primary"
       aria-current="page">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">首页</span>
    </a>
    <a href="checkin.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant
                       hover:text-on-surface transition-colors">
      <i data-lucide="plus-circle" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">打卡</span>
    </a>
    <a href="data.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant
                       hover:text-on-surface transition-colors">
      <i data-lucide="trending-up" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">数据</span>
    </a>
    <a href="stats.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant
                       hover:text-on-surface transition-colors">
      <i data-lucide="bar-chart" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">统计</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant
                       hover:text-on-surface transition-colors">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">我的</span>
    </a>
  </nav>
  <!-- @nav:end 导航组件，不需要的页面则不要复制此段 -->

  <script>
    // 导航辅助函数
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }

    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }

    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }

    function navBack() {
      console.log(`[原型演示] BACK 返回上一页`);
      if(window.history.length > 1) window.history.back();
    }

    $(function() {
      // 打卡按钮点击
      $('#btn-checkin, #btn-quick-checkin').on('click', function() {
        navPush('checkin.html');
      });

      // 设置目标按钮点击
      $('#btn-set-goal').on('click', function() {
        navPush('profile.html');
      });

      // 通知按钮点击
      $('#btn-notification').on('click', function() {
        console.log('打开通知中心');
        // 后续可实现：弹出通知面板或跳转通知页面
      });
    });
  </script>
  <script>lucide.createIcons();</script>
</body>

</html>
