    @theme {
      /* === 品牌色 === */
      --color-primary:              #F26B3A;
      --color-primary-container:    #FDE8DF;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（M3 色调系统 + Apple HIG 呼吸感） === */

      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FAF8F3;
      --color-surface-container:          #F0EDE6;
      --color-surface-container-high:     #E8E5DE;
      --color-surface-container-highest:  #E0DDD6;
      /* === 文字 === */

      --color-on-surface-variant:   #6B7280;
      /* === 功能色 === */
      --color-success:  #3C8D6E;
      --color-error:    #EF4444;
      --color-warning:  #F59E0B;
      /* === 边框 === */
      --color-outline:          #D1D5DB;
      --color-outline-variant:  #E4DED2;
      /* === 圆角 === */
      --radius-sm:   0.5rem;
      --radius-md:   0.75rem;
      --radius-lg:   1rem;
      --radius-xl:   1.5rem;
      --radius-2xl:  2rem;
      --radius-full: 9999px;
      /* === 阴影 === */

      --shadow-float:  0 10px 25px rgba(0,0,0,0.08);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.12);
      /* === 字体 === */
      --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);

    }
    
    /* 图表数据点样式 */
    .chart-point {
      cursor: pointer;
      transition: r 0.15s ease;
    }
    .chart-point:hover {
      r: 6;
    }
    
    /* 图表提示框 */

      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .chart-tooltip.active {
      opacity: 1;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

  <script>
    $(function() {
      lucide.createIcons();
      
      // 导航辅助函数
      function navPush(route) {
        console.log(`[原型演示] PUSH 到: ${route}`);
        window.location.href = route;
      }

      function navReplace(route) {
        console.log(`[原型演示] REPLACE 为: ${route}`);
        window.location.replace(route);
      }

      function navReset(route) {
        console.log(`[原型演示] RESET 到: ${route}`);
        window.location.href = route;
      }

      function navBack() {
        console.log(`[原型演示] BACK 返回上一页`);
        if(window.history.length > 1) window.history.back();
      }
      
      // TabBar 导航
      $('#nav-home').on('click', function(e) {
        e.preventDefault();
        navReset('home.html');
      });
      
      $('#nav-checkin').on('click', function(e) {
        e.preventDefault();
        navReset('checkin.html');
      });
      
      $('#nav-stats').on('click', function(e) {
        e.preventDefault();
        navReset('stats.html');
      });
      
      $('#nav-profile').on('click', function(e) {
        e.preventDefault();
        navReset('profile.html');
      });
      
      // 时间范围选择器
      $('.time-filter').on('click', function() {
        $('.time-filter').removeClass('bg-primary text-on-primary')
                        .addClass('bg-surface-container text-on-surface-variant');
        $(this).removeClass('bg-surface-container text-on-surface-variant')
               .addClass('bg-primary text-on-primary');
        
        // 根据选择的时间范围，应更新图表数据
        // 实际实现需要：1. 根据时间范围筛选数据 2. 重新计算 Y 轴刻度 3. 重绘 SVG 图表
        console.log('切换时间范围:', $(this).text().trim());
      });
      
      // 体重图表触摸交互
      $('#weight-chart .chart-point').on('mouseenter touchstart', function(e) {
        e.preventDefault();
        const $point = $(this);
        const value = $point.data('value');
        const date = $point.data('date');
        const cx = parseFloat($point.attr('cx'));
        const cy = parseFloat($point.attr('cy'));
        
        // 获取 SVG 和容器的实际尺寸
        const $svg = $('#weight-chart');
        const svgWidth = $svg[0].viewBox.baseVal.width;
        const svgHeight = $svg[0].viewBox.baseVal.height;
        const containerWidth = $('#weight-chart-container').width();
        const containerHeight = $('#weight-chart-container').height();
        
        // 计算实际位置
        const scale = containerWidth / svgWidth;
        const actualX = cx * scale;
        const actualY = cy * scale;
        
        // 更新提示框内容
        $('#weight-tooltip-date').text(date);
        $('#weight-tooltip-value').text(value + ' kg');
        
        // 定位提示框
        const $tooltip = $('#weight-tooltip');
        $tooltip.css({
          left: (actualX - 40) + 'px',
          top: (actualY - 60) + 'px'
        }).addClass('active');
      });
      
      $('#weight-chart .chart-point').on('mouseleave touchend', function() {
        $('#weight-tooltip').removeClass('active');
      });
      
      // 腰围图表触摸交互
      $('#waist-chart .chart-point').on('mouseenter touchstart', function(e) {
        e.preventDefault();
        const $point = $(this);
        const value = $point.data('value');
        const date = $point.data('date');
        const cx = parseFloat($point.attr('cx'));
        const cy = parseFloat($point.attr('cy'));
        
        // 获取 SVG 和容器的实际尺寸
        const $svg = $('#waist-chart');
        const svgWidth = $svg[0].viewBox.baseVal.width;
        const containerWidth = $('#waist-chart-container').width();
        
        // 计算实际位置
        const scale = containerWidth / svgWidth;
        const actualX = cx * scale;
        const actualY = cy * scale;
        
        // 更新提示框内容
        $('#waist-tooltip-date').text(date);
        $('#waist-tooltip-value').text(value + ' cm');
        
        // 定位提示框
        const $tooltip = $('#waist-tooltip');
        $tooltip.css({
          left: (actualX - 40) + 'px',
          top: (actualY - 60) + 'px'
        }).addClass('active');
      });
      
      $('#waist-chart .chart-point').on('mouseleave touchend', function() {
        $('#waist-tooltip').removeClass('active');
      });
      
      // 分享按钮
      $('#btn-share').on('click', function() {

      });
      
      // 导出 CSV 按钮
      $('#btn-export').on('click', function() {
        // 导出 CSV 功能：
        // 1. 收集当前筛选时间范围内的体重和腰围数据
        // 2. 生成 CSV 格式字符串：日期,体重(kg),腰围(cm)
